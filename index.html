<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masih Hackering | پلتفرم حرفه‌ای خدمات</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-neon: #bc13fe; 
            --secondary-neon: #4d4dff; 
            --glass-bg: rgba(0, 0, 0, 0.7); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #050505;
            color: var(--text-color);
            overflow-x: hidden;
            /* اینجا عکس خودت رو قرار دادم با یک لایه تیره برای خوانایی متن‌ها */
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('IMG_20261010_185310_910.webp'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            line-height: 1.6;
        }

        /* استایل شیشه‌ای برای پنل‌ها */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
        }

        /* بخش هدر (تیتر اصلی) */
        header {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(188, 19, 254, 0.5));
        }

        /* بخش خدمات (کارت‌ها) */
        .services-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 50px 10%;
        }

        .service-card {
            padding: 40px 25px;
            text-align: center;
            transition: all 0.4s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-card:hover {
            transform: translateY(-12px);
            border-color: var(--primary-neon);
            box-shadow: 0 15px 45px rgba(188, 19, 254, 0.25);
        }

        .service-card h3 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            color: var(--secondary-neon);
        }

        /* دکمه‌های سفارش */
        .order-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .order-button:hover {
            box-shadow: 0 0 20px var(--primary-neon);
            transform: scale(1.05);
        }

        /* بخش ثبت هویت VIP */
        .identity-section {
            padding: 80px 10%;
            display: flex;
            justify-content: center;
        }

        .identity-form {
            width: 100%;
            max-width: 550px;
            padding: 40px;
        }

        .identity-form h2 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #fff, var(--primary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .identity-form input {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .identity-form input:focus {
            border-color: var(--primary-neon);
            background: rgba(255, 255, 255, 0.1);
        }

        /* افکت نمایش هنگام اسکرول */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .services-container { padding: 30px 5%; }
            .identity-section { padding: 50px 5%; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="reveal">Masih Hackering</h1>
        <p class="reveal" style="font-size: 1.3rem; color: #ddd;">دنیای دیجیتال، با سبک شخصی شما</p>
    </header>

    <section class="services-container">
        <!-- کارت ۱ -->
        <div class="service-card glass-panel reveal">
            <div>
                <h3>طراحی لوگو</h3>
                <p>ساخت برندینگ حرفه‌ای و خیره‌کننده</p>
            </div>
            <button class="order-button" onclick="sendTelegramOrder('طراحی لوگو')">سفارش فوری 🚀</button>
        </div>

        <!-- کارت ۲ -->
        <div class="service-card glass-panel reveal">
            <div>
                <h3>ساخت بات تلگرام</h3>
                <p>اتوماسیون هوشمند برای کسب‌وکار شما</p>
            </div>
            <button class="order-button" onclick="sendTelegramOrder('ساخت بات تلگرام')">سفارش فوری 🚀</button>
        </div>

        <!-- کارت ۳ -->
        <div class="service-card glass-panel reveal">
            <div>
                <h3>توسعه اپلیکیشن</h3>
                <p>برنامه‌های اندرویدی با استایل خاص</p>
            </div>
            <button class="order-button" onclick="sendTelegramOrder('توسعه اپلیکیشن')">سفارش فوری 🚀</button>
        </div>
    </section>

    <section class="identity-section">
        <div class="identity-form glass-panel reveal">
            <h2>ثبت هویت مشتری VIP</h2>
            <input type="text" id="userName" placeholder="نام و نام خانوادگی">
            <input type="text" id="userPhone" placeholder="شماره تماس یا تلگرام">
            <button class="order-button" style="width: 100%;" onclick="sendIdentityToTelegram()">تایید و ارسال اطلاعات 💎</button>
            <div id="statusMsg" style="margin-top: 20px; text-align: center; font-weight: bold;"></div>
        </div>
    </section>

    <footer>
        &copy; 2026 Masih Hackering. All Rights Reserved.
    </footer>

    <script>
        // آیدی تلگرام شما
        const TELEGRAM_USER = "ma3ih01";

        // تابع ارسال مستقیم برای هر دکمه سفارش
        function sendTelegramOrder(serviceName) {
            const msg = encodeURIComponent(`سلام مسیح عزیز، من می‌خوام پروژه "${serviceName}" رو سفارش بدم. لطفاً راهنماییم کن!`);
            window.open(`https://t.me/${TELEGRAM_USER}?text=${msg}`, '_blank');
        }

        // تابع ارسال فرم ثبت هویت
        function sendIdentityToTelegram() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const status = document.getElementById('statusMsg');

            if(!name || !phone) {
                status.innerText = "لطفاً تمام فیلدها را پر کنید!";
                status.style.color = "#ff4d4d";
                return;
            }

            const msg = encodeURIComponent(`💎 ثبت مشتری جدید VIP:\n👤 نام: ${name}\n📱 تماس: ${phone}`);
            
            status.innerText = "در حال انتقال...";
            status.style.color = "var(--primary-neon)";

            setTimeout(() => {
                window.open(`https://t.me/${TELEGRAM_USER}?text=${msg}`, '_blank');
                status.innerText = "با موفقیت ارسال شد ✅";
                status.style.color = "#00ff88";
            }, 800);
        }

        // انیمیشن اسکرول (Reveal on Scroll)
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 100;
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                }
            }
        }

        window.addEventListener("scroll", reveal);
        // اجرای اولیه برای المان‌هایی که در دید هستند
        reveal();
    </script>

</body>
</html>
