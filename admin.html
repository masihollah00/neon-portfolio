
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>پنل مدیریت | Masih Hackring</title>
  <style>
    body{font-family:Tahoma,Arial;background:#101018;color:#fff;margin:0;padding:20px}
    main{max-width:850px;margin:auto}
    section,.service{background:#1d1d2b;padding:18px;border-radius:14px;margin:14px 0}
    input,button{box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #555;margin:5px 0}
    input{background:#111;color:white;width:100%}
    button{background:#ff35d3;color:#111;font-weight:bold;cursor:pointer}
    .service{display:grid;grid-template-columns:1fr 130px 100px;gap:10px;align-items:center}
    #status{white-space:pre-wrap;color:#ffd166}
    @media(max-width:600px){.service{grid-template-columns:1fr}.service button{width:100%}}
  </style>
</head>
<body>
<main>
  <h1>پنل مدیریت سیفلا</h1>
  <p>Masih Hackring</p>

  <section id="login">
    <h2>ورود مدیر</h2>
    <input id="email" type="email" placeholder="ایمیل حساب مدیر">
    <input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password">
    <button id="loginBtn">ورود</button>
  </section>

  <section id="panel" hidden>
    <button id="logoutBtn">خروج</button>
    <h2>مدیریت قیمت خدمات</h2>
    <div id="services">در حال بارگذاری...</div>
  </section>
  <p id="status" role="status"></p>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// این دو مقدار را از Project Settings > API در Supabase بگیر.
const SUPABASE_URL = 'https://pughgsqtrnjzlzppwclp.supabase.co';
const SUPABASE_PUBLIC_KEY = 'کلید_عمومی_یا_publishable_خودت';

const db = createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);
const $ = id => document.getElementById(id);
const status = message => $('status').textContent = message;

async function loadServices(){
  const {data: userResult} = await db.auth.getUser();
  if(!userResult.user){
    $('login').hidden = false;
    $('panel').hidden = true;
    return;
  }

  const {data: admin, error: adminError} = await db
    .from('site_admins').select('user_id')
    .eq('user_id', userResult.user.id).maybeSingle();

  if(adminError || !admin){
    status('این حساب مجوز مدیر ندارد.');
    await db.auth.signOut();
    return;
  }

  $('login').hidden = true;
  $('panel').hidden = false;

  const {data, error} = await db.from('store_services')
    .select('id,service_key,title,price_toman,is_active')
    .order('id');

  if(error){status('خطای بارگذاری: ' + error.message);return;}

  $('services').replaceChildren();
  for(const item of data || []){
    const card = document.createElement('div');
    card.className = 'service';

    const title = document.createElement('strong');
    title.textContent = item.title || item.service_key;

    const price = document.createElement('input');
    price.type = 'number';
    price.min = '0';
    price.placeholder = 'قیمت تومان';
    price.value = item.price_toman ?? '';
    price.setAttribute('aria-label','قیمت '+(item.title || item.service_key));

    const active = document.createElement('input');
    active.type = 'checkbox';
    active.checked = item.is_active;
    active.setAttribute('aria-label','فعال بودن خدمت');

    const save = document.createElement('button');
    save.textContent = 'ذخیره';

    save.addEventListener('click', async () => {
      const raw = price.value.trim();
      const amount = raw === '' ? null : Number(raw);
      if(raw !== '' && (!Number.isSafeInteger(amount) || amount < 0)){
        status('قیمت باید یک عدد صحیح و غیرمنفی باشد.');
        return;
      }

      save.disabled = true;
      const {error: updateError} = await db.from('store_services')
        .update({
          price_toman: amount,
          is_active: active.checked,
          updated_at: new Date().toISOString()
        })
        .eq('id', item.id);

      save.disabled = false;
      status(updateError
        ? 'ذخیره ناموفق: ' + updateError.message
        : 'تغییرات ذخیره شد. برای نمایش در سایت اصلی، اتصال index.html هم باید تنظیم شود.');
    });

    card.append(title, price, active, save);
    $('services').append(card);
  }
  status('خدمات بارگذاری شدند.');
}

$('loginBtn').addEventListener('click', async () => {
  status('در حال ورود...');
  const {error} = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });
  if(error){status('ورود ناموفق: '+error.message);return;}
  await loadServices();
});

$('logoutBtn').addEventListener('click', async () => {
  await db.auth.signOut();
  $('login').hidden = false;
  $('panel').hidden = true;
  status('خارج شدی.');
});

if(SUPABASE_PUBLIC_KEY.startsWith('کلید_')){
  status('ابتدا کلید عمومی Supabase را در کد وارد کن.');
}else{
  await loadServices();
  db.auth.onAuthStateChange(() => loadServices());
}
</script>
</body>
</html>
